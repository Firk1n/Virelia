<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map Encyclopedia</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="map"></div>

    <div class="map-buttons">
        <button type="button" id="open-reader" class="map-button">Wiki</button>
        <button type="button" id="open-book" class="map-button">Book</button>
    </div>

    <div id="sidebar">
        <span class="close-btn" onclick="closeSidebar()"><span class="close-x">&times;</span></span>
        <div id="sidebar-content">
            <h2>Welcome</h2>
            <p>Click a location on the map to begin.</p>
        </div>
        <div id="entry-bar" hidden>
            <button type="button" id="entry-back" class="entry-bar-btn">&lsaquo; Back</button>
            <button type="button" id="narration-prev" class="entry-bar-btn narration-jump"
                    aria-label="Go to the beginning of this paragraph" title="Previous paragraph" disabled>&#8630;</button>
            <button type="button" id="narration-play" class="entry-bar-btn narration-play" aria-label="Read this entry aloud" disabled>&#9654;</button>
            <button type="button" id="narration-next" class="entry-bar-btn narration-jump"
                    aria-label="Skip to the next paragraph" title="Next paragraph" disabled>&#8631;</button>
            <input type="range" id="narration-seek" min="0" max="1000" value="0" step="1"
                   aria-label="Seek within the narration" disabled>
            <span id="narration-time" class="narration-time">0:00 / --:--</span>
            <span class="narration-speed">
                <input type="range" id="narration-speed" min="1" max="3" value="1" step="0.1"
                       aria-label="Narration speed">
                <output id="narration-speed-value" for="narration-speed">1×</output>
            </span>
            <span id="narration-status" class="narration-status" role="status" aria-live="polite"></span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Data. wiki-data.js is hand-maintained map metadata; the two generated
         files come from scripts/build-wiki.mjs and scripts/build-book.mjs and are
         merged in, never substituted. Order matters: wiki-runtime.js does the
         merging and must see all three. -->
    <script src="wiki-data.js"></script>
    <script src="generated/wiki-overrides.js"></script>
    <script src="generated/book.js"></script>
    <script src="region-geometry.js"></script>
    <script src="region-overlays.js"></script>

    <script src="wiki-runtime.js"></script>
    <script src="main.js"></script>
    <script src="regions.js"></script>
    <script src="narration.js"></script>
    <script src="reader.js"></script>
    <script src="book.js"></script>
    <script src="edit.js"></script>

<div id="lightbox" onclick="closeLightbox()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:5000; justify-content:center; align-items:center; cursor: zoom-out;">
    <img id="lightbox-img" style="max-width:95%; max-height:95%;">
</div>

<script>
    // Function to open the lightbox
    function showLightbox(src) {
        let box = document.getElementById('lightbox');
        let img = document.getElementById('lightbox-img');
        img.src = src;
        box.style.display = 'flex'; // Uses flexbox to center the image
    }

    // Function to close it
    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }

    document.getElementById('entry-back').addEventListener('click', function () {
        // Back is the History API's back, not a private stack: the sidebar
        // control and the browser's own button must do the same thing.
        history.back();
    });
</script>
</body>
</html>
