<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Virelia - Interactive Map</title>
    <meta name="description" content="An interactive map of Virelia: twelve regions, their cities and ruins, with the full illustrated history, races and factions — read on the page or aloud.">
    <meta name="author" content="Firk1n">
    <meta name="theme-color" content="#6d746b">

    <!-- Pasted into a chat, the bare URL said nothing about what it was. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Virelia">
    <meta property="og:title" content="Virelia - An Interactive Map and Encyclopedia">
    <meta property="og:description" content="Twelve regions, their cities and ruins, with the full illustrated history, races and factions — read on the page or aloud.">
    <meta property="og:url" content="https://vireliamap.vercel.app/">
    <meta property="og:image" content="https://vireliamap.vercel.app/assets/social-card.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The painted world map of Virelia, its regions named.">
    <meta name="twitter:card" content="summary_large_image">

    <!-- The map marker, so the tab is findable at a glance. Inline because one
         circle is not worth a request. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236d746b'/><circle cx='16' cy='16' r='8.5' fill='%2396373f' stroke='%23fdf6e3' stroke-width='3'/></svg>">
    <link rel="apple-touch-icon" href="assets/social-card.jpg">
    <link rel="manifest" href="manifest.webmanifest">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Icons, defined once and referenced with <use>. The wiki's mark appears
         both on the map button and beside every entry title, and the two have
         to be the same drawing or the second one means nothing. Feather icons
         (MIT), which suit the map's line-drawn hand. -->
    <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true" focusable="false">
        <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path>
        </symbol>
        <symbol id="icon-wiki" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </symbol>
        <symbol id="icon-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
        </symbol>
        <symbol id="icon-map" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
        </symbol>
        <symbol id="icon-book" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </symbol>
    </svg>

    <div id="map"></div>

    <div class="map-buttons">
        <button type="button" id="open-search" class="map-button" title="Search Virelia (/)">
            <svg class="map-button-icon" aria-hidden="true"><use href="#icon-search"></use></svg>Search</button>
        <button type="button" id="open-reader" class="map-button" title="Read the wiki">
            <svg class="map-button-icon" aria-hidden="true"><use href="#icon-wiki"></use></svg>Wiki</button>
        <button type="button" id="open-book" class="map-button" title="Open the book">
            <svg class="map-button-icon" aria-hidden="true"><use href="#icon-book"></use></svg>Book</button>
        <button type="button" id="open-offline" class="map-button" hidden>Offline</button>
    </div>
    <div id="offline-dialog" hidden role="dialog" aria-modal="true" aria-label="Download Virelia">
      <div class="offline-card"><button id="offline-close" class="offline-close" type="button" aria-label="Close">&times;</button><h2>Download</h2><p>Will make the website available offline</p><strong id="offline-size"></strong><p id="offline-progress" hidden></p><button id="offline-download" type="button">Download</button></div>
    </div>

    <div id="sidebar">
        <!-- Back mirrors the close control across the top of the panel: the two
             are what navigates the panel, so they belong as a pair rather than
             one of them living among the audio controls. It carries only an
             arrow -- the place it returns to is in its tooltip and its
             accessible name, where it costs no room -- and it is absent, not
             greyed, when there is nowhere to go back to. -->
        <button type="button" id="entry-back" hidden aria-label="Back"><span class="entry-back-glyph">&lsaquo;</span></button>
        <span class="close-btn" onclick="closeSidebar()"><span class="close-x">&times;</span></span>
        <div id="sidebar-content">
            <h2>Welcome</h2>
            <p>Click a location on the map to begin.</p>
        </div>
        <!-- One row, and only the player: Back moved to the top of the panel
             and the speed slider became a button, which between them freed the
             width that used to push this onto a second line. -->
        <div id="entry-bar" hidden>
            <div class="entry-bar-controls">
            <button type="button" id="narration-prev" class="entry-bar-btn narration-jump"
                    aria-label="Go to the beginning of this paragraph" title="Previous paragraph" disabled>&#8630;</button>
            <button type="button" id="narration-play" class="entry-bar-btn narration-play" aria-label="Read this entry aloud" disabled>&#9654;</button>
            <button type="button" id="narration-next" class="entry-bar-btn narration-jump"
                    aria-label="Skip to the next paragraph" title="Next paragraph" disabled>&#8631;</button>
            <input type="range" id="narration-seek" min="0" max="1000" value="0" step="1"
                   aria-label="Seek within the narration" disabled>
            <span id="narration-time" class="narration-time">0:00 / --:--</span>
            <span class="narration-speed-wrap">
                <button type="button" id="narration-speed" class="entry-bar-btn narration-speed"
                        aria-haspopup="true" aria-expanded="false" aria-controls="narration-speed-popover"
                        aria-label="Playback speed 1×" title="Playback speed">1×</button>
                <div id="narration-speed-popover" class="narration-speed-popover" hidden>
                    <output id="narration-speed-value" for="narration-speed-range">1×</output>
                    <input type="range" id="narration-speed-range" min="1" max="3" value="1" step="0.1"
                           orient="vertical" aria-label="Narration speed">
                </div>
            </span>
            </div>
            <!-- Folds the player away for anyone reading rather than listening.
                 One control for both surfaces, because there is only one bar
                 and it moves to whichever of them is showing the prose. -->
            <button type="button" id="narration-toggle" class="narration-toggle"
                    aria-expanded="true" aria-controls="entry-bar" title="Hide the audio player">
                <svg aria-hidden="true"><use href="#icon-audio"></use></svg>
            </button>
            <span id="narration-status" class="narration-status" role="status" aria-live="polite"></span>
        </div>
    </div>

    <div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
        <button type="button" id="lightbox-close" class="lightbox-close" aria-label="Close image">&times;</button>
        <img id="lightbox-img" alt="">
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Data. wiki-data.js is hand-maintained map metadata; the generated files
         come from scripts/build-wiki.mjs and scripts/build-region-bounds.mjs and
         are merged in, never substituted. Order matters: wiki-runtime.js does
         the merging and must see them all.

         Two things deliberately absent here:
         generated/book.js (417 KB) is fetched by reader.js on first open --
         it is the same prose again, for a view most visitors never open; and
         region-geometry.js (832 KB) is only needed to *edit* borders, so the
         page gets generated/region-bounds.js, the twelve boxes it reads. -->
    <script src="wiki-data.js"></script>
    <script src="generated/wiki-overrides.js"></script>
    <script src="generated/region-bounds.js"></script>
    <script src="region-overlays.js"></script>

    <script src="wiki-runtime.js"></script>
    <script src="main.js"></script>
    <script src="regions.js"></script>
    <script src="narration.js"></script>
    <script src="reader.js"></script>
    <script src="book.js"></script>
    <script src="search.js"></script>
    <script src="generated/offline-manifest.js"></script>
    <script src="offline.js"></script>

<script>
    // --- LIGHTBOX ---
    // Entry and book images open here. It is a modal, so it behaves like the
    // other two: Escape closes it, focus goes in and comes back, and the page
    // behind it does not scroll away underneath.
    (function () {
        'use strict';
        var box = document.getElementById('lightbox');
        var img = document.getElementById('lightbox-img');
        var closeButton = document.getElementById('lightbox-close');
        var opener = null;

        window.showLightbox = function (src, alt) {
            opener = document.activeElement;
            img.src = src;
            // Without this the image is announced as the whole dialog's
            // content and a screen reader has nothing to say about it.
            img.alt = alt || 'Enlarged view';
            box.hidden = false;
            document.body.classList.add('lightbox-open');
            closeButton.focus();
        };

        window.closeLightbox = function () {
            if (box.hidden) return;
            box.hidden = true;
            document.body.classList.remove('lightbox-open');
            img.removeAttribute('src');
            if (opener && opener.focus) opener.focus();
            opener = null;
        };

        // Clicking the backdrop closes; clicking the image itself does not,
        // so a mis-drag while looking at a map does not dismiss it.
        box.addEventListener('click', function (event) {
            if (event.target === box) closeLightbox();
        });
        closeButton.addEventListener('click', closeLightbox);
        box.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') { event.preventDefault(); closeLightbox(); }
            // Two focusable things, one of which is the image; keep Tab here.
            if (event.key === 'Tab') { event.preventDefault(); closeButton.focus(); }
        });
    })();

    document.getElementById('entry-back').addEventListener('click', function () {
        // Back is the History API's back, not a private stack: the sidebar
        // control and the browser's own button must do the same thing.
        history.back();
    });

    // Edit mode is for the author, not the reader: 34 KB of tooling plus 832 KB
    // of traced geometry are fetched only when ?edit asks for them.
    if (/[?&]edit(=|&|$)/.test(window.location.search)) {
        // async=false keeps injected scripts in order, so edit.js still finds
        // the geometry loaded when it runs.
        ['region-geometry.js', 'edit.js'].forEach(function (src) {
            var script = document.createElement('script');
            script.src = src;
            script.async = false;
            document.body.appendChild(script);
        });
    }
</script>
</body>
</html>
